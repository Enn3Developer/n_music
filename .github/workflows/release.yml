name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_android:
        description: Build signed Android downloads for initial Play Console setup
        type: boolean
        default: false
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open('n_player/Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag:
              tag_version = tag.removeprefix('releases/').removeprefix('n_player/').removeprefix('v')
              if tag_version != version:
                  raise SystemExit(f'Tag {tag!r} does not match n_player version {version!r}')
          prerelease = '-' in version.split('+', 1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={str(prerelease).lower()}', file=output)
          PY

  package:
    needs: plan
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtime: linux-x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            runtime: win-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold cmake pkg-config nasm \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libfuse2
      - name: Build app
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package n_player --bin n_player --target "$TARGET"
      - name: Check installer hooks without starting the UI
        timeout-minutes: 1
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          executable="target/$TARGET/release/n_player"
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable="$executable.exe"
          fi
          for hook in install updated obsolete uninstall; do
            "$executable" "--veloapp-$hook" "$RELEASE_VERSION"
          done
      - name: Install Velopack
        run: dotnet tool restore
      - name: Package app
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: bash scripts/package-release.sh "$RUNTIME"
      - name: Check packaged Linux startup
        if: runner.os == 'Linux'
        timeout-minutes: 1
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          images=("$GITHUB_WORKSPACE"/target/velopack/linux-x64/*.AppImage)
          mkdir -p target/velopack-smoke
          cd target/velopack-smoke
          "${images[0]}" --appimage-extract > /dev/null
          ./squashfs-root/AppRun --veloapp-install "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.runtime }}
          path: target/velopack/${{ matrix.runtime }}/*
          if-no-files-found: error

  android:
    needs: plan
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sign: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.sign_android) }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEY_PASSWORD || '' }}

  publish:
    needs: [plan, package, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: velopack-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "N Music $RELEASE_VERSION" --generate-notes \
            "${flags[@]}" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false

  google-play:
    needs: [plan, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: google-play-internal
      cancel-in-progress: false
    steps:
      - name: Check Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo '::error::Missing required Actions secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: android-release
      - name: Upload to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.enn3developer.n_music
          releaseFiles: android-release/*.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.plan.outputs.version }}
