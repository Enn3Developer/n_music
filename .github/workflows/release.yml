name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_android:
        description: Build signed Android downloads for initial Play Console setup
        type: boolean
        default: false
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag:
              tag_version = tag.removeprefix('releases/').removeprefix('n_music_desktop/').removeprefix('v')
              if tag_version != version:
                  raise SystemExit(f'Tag {tag!r} does not match workspace version {version!r}')
          prerelease = '-' in version.split('+', 1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={str(prerelease).lower()}', file=output)
          PY

  package:
    # The name the job had before the Qt columns joined the matrix.
    name: package (${{ matrix.runner }}, ${{ matrix.target }}, ${{ matrix.runtime }})
    needs: plan
    timeout-minutes: 60
    env:
      # The QML interface needs Qt 6.8 or newer: PathRectangle came in 6.8.
      QT_VERSION: 6.8.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            runtime: linux-x64
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-dir: gcc_64
            qt-archives: icu qtbase qtdeclarative qtwayland
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            runtime: win-x64
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-dir: msvc2022_64
            qt-archives: qtbase qtdeclarative
          - runner: macos-14
            target: aarch64-apple-darwin
            runtime: osx-arm64
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos
            qt-archives: qtbase qtdeclarative
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-qt${{ env.QT_VERSION }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Build tools, ALSA, the OpenGL Qt links to, vpk's AppImage and delta tools, and the
          # X11 and Wayland libraries of Qt's platform plugins, which the AppImage carries.
          sudo apt-get install -y clang mold cmake pkg-config nasm libasound2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfuse2t64 squashfs-tools zstd \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        # vpk builds delta packages with zstd.
        run: command -v zstd || brew install zstd
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt-arch }}-${{ matrix.qt-archives }}
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        env:
          QT_HOST: ${{ matrix.qt-host }}
          QT_ARCH: ${{ matrix.qt-arch }}
          QT_ARCHIVES: ${{ matrix.qt-archives }}
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          read -ra archives <<< "$QT_ARCHIVES"
          python -m aqt install-qt "$QT_HOST" desktop "$QT_VERSION" "$QT_ARCH" \
            --outputdir "$RUNNER_TEMP/qt" --archives "${archives[@]}"
      - name: Use Qt
        env:
          QT_DIR: ${{ matrix.qt-dir }}
        run: |
          qt="$RUNNER_TEMP/qt/$QT_VERSION/$QT_DIR"
          exe=
          if [[ "$RUNNER_OS" == Windows ]]; then
            qt=$(cygpath -m "$qt")
            exe=.exe
          fi
          "$qt/bin/qmake$exe" -query QT_VERSION
          # cxx-qt builds against the Qt that QMAKE belongs to.
          {
            echo "QT_ROOT_DIR=$qt"
            echo "QMAKE=$qt/bin/qmake$exe"
          } >> "$GITHUB_ENV"
      - name: Build app
        env:
          TARGET: ${{ matrix.target }}
          # N Music's Telegram API credentials, from my.telegram.org. Without them, as in pull
          # requests from forks, the app leaves Telegram out.
          N_MUSIC_TELEGRAM_API_ID: ${{ secrets.N_MUSIC_TELEGRAM_API_ID }}
          N_MUSIC_TELEGRAM_API_HASH: ${{ secrets.N_MUSIC_TELEGRAM_API_HASH }}
        run: cargo build --locked --release --package n_music_desktop --bin n_music_desktop --target "$TARGET"
      - name: Install Velopack
        run: dotnet tool restore
      - name: Stage app with its Qt runtime
        id: stage
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: bash .github/scripts/package-desktop.sh stage "$RUNTIME"
      - name: Check installer hooks without starting the UI
        timeout-minutes: 1
        env:
          LAUNCHER: ${{ steps.stage.outputs.launcher }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for hook in install updated obsolete uninstall; do
            "$LAUNCHER" "--veloapp-$hook" "$RELEASE_VERSION"
          done
      - name: Package app
        env:
          RUNTIME: ${{ matrix.runtime }}
          # Reads the previous release, to build a delta package from it.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/package-desktop.sh pack "$RUNTIME"
      - name: Check packaged Linux startup
        if: runner.os == 'Linux'
        timeout-minutes: 1
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          images=("$GITHUB_WORKSPACE"/target/velopack/linux-x64/*.AppImage)
          mkdir -p target/velopack-smoke
          cd target/velopack-smoke
          "${images[0]}" --appimage-extract > /dev/null
          ./squashfs-root/AppRun --veloapp-install "$RELEASE_VERSION"
          # Start the interface too: with no display and no GPU, it should load its QML and keep
          # running. The build's Qt lends the offscreen platform the AppImage does not carry.
          status=0
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORM_PLUGIN_PATH="$QT_ROOT_DIR/plugins/platforms" \
            QT_QUICK_BACKEND=software timeout 15 ./squashfs-root/AppRun > interface.log 2>&1 || status=$?
          cat interface.log
          if [[ $status -ne 124 ]] || grep -q 'failed to load component' interface.log; then
            echo "The interface did not start (exit status $status)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ matrix.runtime }}
          path: target/velopack/${{ matrix.runtime }}/*
          if-no-files-found: error

  android:
    needs: plan
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sign: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.sign_android) }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_android)) && secrets.ANDROID_KEY_PASSWORD || '' }}

  publish:
    needs: [ plan, package, android ]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: velopack-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: android-arm64
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "N Music $RELEASE_VERSION" --generate-notes \
            "${flags[@]}" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false

  google-play:
    needs: [ plan, publish ]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: google-play-internal
      cancel-in-progress: false
    steps:
      - name: Check Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo '::error::Missing required Actions secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: android-arm64
          path: android-release
      - name: Upload to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.enn3developer.n_music
          releaseFiles: android-release/*.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.plan.outputs.version }}
