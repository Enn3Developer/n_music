[package]
name = "n_music_desktop"
version.workspace = true
edition = "2021"
authors = ["Enn3Developer <arturpeshko39@gmail.com>"]
repository = "https://github.com/Enn3Developer/n_music"
description = "Desktop entry point for N Music"

[[bin]]
name = "n_music_desktop"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.17"

[dependencies]
n_music_core = { path = "../n_music_core" }
n_event_bus = { path = "../n_event_bus" }
n_music_media_notification = { path = "../n_music_media_notification" }
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg-wgpu"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
paste = "1.0.15"
sys-locale = "0.3"
tokio = { version = "1.45", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# Keep this in sync with vpk in .config/dotnet-tools.json.
velopack = "=1.2.0"
directories = "6.0"
rfd = "0.17"
open = "5.3"
arboard = "3.4"

[target.'cfg(all(not(target_os = "android"), not(target_env = "msvc")))'.dependencies]
tikv-jemallocator = "0.7"
