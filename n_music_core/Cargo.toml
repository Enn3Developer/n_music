[package]
name = "n_music_core"
version.workspace = true
authors = ["Enn3Developer <arturpeshko39@gmail.com>"]
edition = "2021"
license = "GPL-3.0-only"
description = "UI-agnostic core and audio engine of N Music"
homepage = "https://github.com/Enn3Developer/n_music"
repository = "https://github.com/Enn3Developer/n_music"

[lib]
crate-type = ["lib"]

[features]
# Telegram chats as libraries, signed in to through grammers.
telegram = ["dep:grammers-client", "dep:tokio", "dep:glass_pumpkin"]

[dependencies]
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-core = "0.6.1"
audiopus = { git = "https://github.com/Flakebi/audiopus.git", branch = "master" }
rand = "0.10"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rtrb = "0.4"
cpal = { version = "0.18", features = ["pulseaudio"] }
dasp = "0.11"
multitag = "0.4"
n_event_bus = { path = "../n_event_bus" }
log = "0.4"
flexi_logger = { version = "0.31", default-features = false }
zune-image = { version = "0.5", default-features = false, features = ["png", "jpeg", "jpeg-xl", "bmp", "threads"] }
zune-imageprocs = "0.5.1"
zune-core = { version = "=0.5.1", default-features = false, features = ["std"] }
rimage = { version = "0.12.0", default-features = false, features = ["mozjpeg", "resize", "threads", "webp"] }
tempfile = "3.20"
infer = { version = "0.22", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rubato = "5"
ureq = "3.4"
url = "2.5"
percent-encoding = "2.3"
# Telegram's client. The session is kept with rusqlite: grammers' own storage would bring a
# second SQLite.
grammers-client = { version = "0.10", default-features = false, optional = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "time"], optional = true }
# Only pinned: grammers-crypto 0.10 asks for 2.0.0-rc0 and does not build with 2.0.0-rc1.
glass_pumpkin = { version = "=2.0.0-rc0", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6.0"
