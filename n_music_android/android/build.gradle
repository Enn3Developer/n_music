plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def cargoVersion = (new File(rootDir, '../Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)
if (!cargoVersion.find()) {
    throw new GradleException('Cannot read the workspace version from Cargo.toml')
}
def appVersionName = cargoVersion.group(1)
def appVersionCode = providers.gradleProperty('androidVersionCode').get().toInteger()
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('androidVersionCode must be between 1 and 2100000000')
}
def signingValues = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
                     'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable(it).orNull]
}
def hasSigning = signingValues.values().every { it }
if (signingValues.values().any { it } && !hasSigning) {
    throw new GradleException('Provide all four Android signing environment variables')
}
if (providers.gradleProperty('requireAndroidSigning').orElse('false').get().toBoolean() && !hasSigning) {
    throw new GradleException('Android release signing credentials are required')
}

android {
    ndkVersion "28.2.13676358"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.enn3developer.n_music"
        minSdk 30
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        // Both come from compile_rust.sh: the native core and its UniFFI bindings.
        main.jniLibs.srcDirs = [layout.buildDirectory.dir('rustJniLibs')]
        main.java.srcDirs += [layout.buildDirectory.dir('generated/uniffi')]
        // The translations, in the format the desktop app shares.
        main.assets.srcDirs += ['../assets']
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(signingValues.ANDROID_KEYSTORE_PATH)
                storePassword signingValues.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingValues.ANDROID_KEY_ALIAS
                keyPassword signingValues.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            // R8 drops the code and resources the app never uses, which shrinks the APK from 37 MB
            // to 15 MB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            //packagingOptions {
            //    doNotStrip '**/*.so'
            //}
            //debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace 'com.enn3developer.n_music'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    def media3 = '1.9.4'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    // Ahead of the BOM's 1.4: the Expressive motion scheme and components the design uses.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha18'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation "androidx.media3:media3-common:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // UniFFI's bindings call the native core through JNA.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
repositories {
    google()
    mavenCentral()
}
