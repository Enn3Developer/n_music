[package]
name = "n_music_android"
version.workspace = true
edition = "2021"
authors = ["Enn3Developer <arturpeshko39@gmail.com>"]
repository = "https://github.com/Enn3Developer/n_music"
description = "Android entry point for N Music"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
slint-build = "1.17"

[target.'cfg(target_os = "android")'.dependencies]
n_music_core = { path = "../n_music_core" }
n_event_bus = { path = "../n_event_bus" }
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "unstable-fontique-010"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
paste = "1.0.15"
sys-locale = "0.3"
ndk-context = "0.1"
jni = "0.22"
