plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def cargoVersion = (new File(rootDir, 'Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)
if (!cargoVersion.find()) {
    throw new GradleException('Cannot read the n_player version from Cargo.toml')
}
def appVersionName = cargoVersion.group(1)
def appVersionCode = providers.gradleProperty('androidVersionCode').get().toInteger()
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('androidVersionCode must be between 1 and 2100000000')
}
def signingValues = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
                     'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable(it).orNull]
}
def hasSigning = signingValues.values().every { it }
if (signingValues.values().any { it } && !hasSigning) {
    throw new GradleException('Provide all four Android signing environment variables')
}
if (providers.gradleProperty('requireAndroidSigning').orElse('false').get().toBoolean() && !hasSigning) {
    throw new GradleException('Android release signing credentials are required')
}

android {
    ndkVersion "28.2.13676358"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.enn3developer.n_music"
        minSdk 30
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main.jniLibs.srcDirs = [layout.buildDirectory.dir('rustJniLibs')]
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(signingValues.ANDROID_KEYSTORE_PATH)
                storePassword signingValues.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingValues.ANDROID_KEY_ALIAS
                keyPassword signingValues.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            //packagingOptions {
            //    doNotStrip '**/*.so'
            //}
            //debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    namespace 'com.enn3developer.n_music'
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'com.google.oboe:oboe:1.9.0'
    implementation 'androidx.media3:media3-session:1.4.1'

    // To use the Android Frame Pacing library
    //implementation "androidx.games:games-frame-pacing:1.9.1"

    // To use the Android Performance Tuner
    //implementation "androidx.games:games-performance-tuner:1.5.0"

    // To use the Games Activity library
//    implementation "androidx.games:games-activity:3.0.5"

    // To use the Games Controller Library
    //implementation "androidx.games:games-controller:2.0.2"

    // To use the Games Text Input Library
    //implementation "androidx.games:games-text-input:2.0.2"
}
repositories {
    google()
    mavenCentral()
}
