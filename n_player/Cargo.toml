[package]
name = "n_player"
version = "2.0.0-alpha.7"
authors = ["Enn3Developer <arturpeshko39@gmail.com>"]
edition = "2021"
repository = "https://github.com/Enn3Developer/n_music"
description = "A simple music player written in Rust + Slint"

[package.metadata.wix]
upgrade-guid = "7CE90BCB-E720-41CF-AFED-DDB3B0AA49E2"
path-guid = "D9DF9822-756A-4015-85DD-99173166A5DC"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
slint-build = "1.16"

[dependencies]
slint = { version = "1.16", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg-wgpu"] }
bitcode = { version = "0.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
n_audio = { path = "../n_audio" }
n_event_bus = { path = "../n_event_bus" }
rand = "0.10"
symphonia = { version = "0.5", default-features = false }
multitag = "0.4"
zune-image = { version = "0.5", default-features = false, features = ["png", "jpeg", "jpeg-xl", "bmp", "threads"] }
zune-imageprocs = "0.5.1"
zune-core = { version = "0.5.1", default-features = false, features = ["std"] }
rimage = { version = "0.12.0", default-features = false, features = ["mozjpeg", "resize", "threads", "webp"] }
tempfile = "3.20"
tokio = { version = "1.45", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
pollster = "0.4.0"
infer = { version = "0.19", default-features = false, features = ["std"] }
sys-locale = "0.3"
zstd = "0.13"
async-trait = "0.1"
paste = "1.0.15"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"

[target.'cfg(target_os = "android")'.dependencies.slint]
version = "1.16"
default-features = false
features = ["backend-android-activity-06"]

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
tikv-jemallocator = "0.6"
rfd = "0.17"
directories = "6.0"
open = "5.3"
arboard = "3.4"