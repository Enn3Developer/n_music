# The Xcode project is generated from this file: edit it, then run `xcodegen < /dev/null` in this
# folder. NMusic.xcodeproj is committed so the app opens and builds without XcodeGen.
name: NMusic
options:
  bundleIdPrefix: com.enn3developer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 23
    # The workspace version (Cargo.toml), shown in Settings › Updates and compared with releases.
    N_MUSIC_VERSION: 2.0.0-alpha.23
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  NMusic:
    type: application
    platform: macOS
    sources:
      - path: NMusic
        excludes:
          - Info.plist
      # Generated by scripts/build-core.sh, which runs first.
      - path: Generated/NMusicCore.swift
        optional: true
        group: Generated
      # The Qt app's translations, the same files and keys: Tr reads them from Resources/lang.
      - path: ../n_music_desktop/assets/lang
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build the core
        script: |
          exec "$SRCROOT/scripts/build-core.sh"
        # Cargo knows best what changed: it runs every build, and does nothing when nothing did.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/NMusicCore.swift
          - $(SRCROOT)/Generated/n_music_ffiFFI.h
          - $(SRCROOT)/Generated/module.modulemap
    settings:
      base:
        PRODUCT_NAME: N Music
        PRODUCT_MODULE_NAME: NMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.enn3developer.n-music.macos
        INFOPLIST_FILE: NMusic/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        # The core: a static library and the C module its Swift bindings call.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        # build-core.sh copies the library it just built here, whichever Cargo profile built it
        # (RUST_PROFILE below, or N_MUSIC_RUST_PROFILE), so the link always takes that one.
        N_MUSIC_CORE_LIB_DIR: $(SRCROOT)/../target/macos/link-$(CONFIGURATION)
        LIBRARY_SEARCH_PATHS: $(N_MUSIC_CORE_LIB_DIR)
        OTHER_LDFLAGS: -ln_music_ffi -liconv -framework AudioToolbox -framework CoreAudio -framework Security -framework SystemConfiguration
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: NO
      configs:
        Debug:
          # The Cargo profile build-core.sh uses by default (N_MUSIC_RUST_PROFILE overrides it).
          RUST_PROFILE: debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          RUST_PROFILE: macos
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
          GCC_OPTIMIZATION_LEVEL: s
          LLVM_LTO: YES_THIN
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  NMusic:
    build:
      targets:
        NMusic: all
    run:
      config: Debug
    archive:
      config: Release
