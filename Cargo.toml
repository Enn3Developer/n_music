[workspace]
resolver = "2"
members = [
    "n_music_core",
    "n_music_desktop",
    "n_music_ffi",
    "n_music_ffi/bindgen",
    "n_event_bus",
    "n_music_media_notification",
]
default-members = [
    "n_music_core",
    "n_music_desktop",
    "n_event_bus",
    "n_music_media_notification",
]

[workspace.package]
version = "2.0.0-alpha.23"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# UniFFI reads the Kotlin bindings' metadata from the library's symbols. Gradle strips the
# library when it packages the app.
[profile.release.package.n_music_ffi]
strip = false

# The macOS app's core: n_music_macos/scripts/build-core.sh builds n_music_ffi with it for
# Release, with `-C target-cpu=apple-m1` (x86-64-v3 on Intel). Unwinding stays on, so a panic
# is caught and logged at the FFI boundary instead of aborting.
[profile.macos]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
# The Swift bindings are generated from the metadata symbols in the library; Xcode strips the
# app when it links it.
strip = false
