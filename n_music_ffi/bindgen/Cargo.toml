[package]
name = "n_music_uniffi_bindgen"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
description = "Generates the Kotlin bindings of n_music_ffi"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
